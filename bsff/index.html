<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clima Fácil</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>🌤️ Clima Fácil</h1>

        <p>Consulte o clima da sua cidade</p>

        <form id="formulario">

            <input
                type="text"
                id="cidade"
                placeholder="Digite uma cidade"
                required
            >

            <button type="submit">
                Consultar
            </button>

        </form>

        <section id="resultado">

            <p>Digite uma cidade para consultar o clima.</p>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
